<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试进行中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e1e4e8;height:100vh;display:flex;overflow:hidden}
.sidebar{width:200px;background:#161b22;border-right:1px solid #21262d;padding:20px 12px;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{font-size:15px;color:#58a6ff;font-weight:700;margin-bottom:28px;padding:0 8px}
.nav-item{padding:9px 12px;border-radius:6px;font-size:13px;color:#8b949e;text-decoration:none;display:block}
.nav-item:hover{background:#1c2128;color:#c9d1d9}
.nav-item.active{background:#1f6feb22;color:#58a6ff;font-weight:600}
.sidebar .spacer{flex:1}
.sidebar .status{font-size:10px;color:#484f58;padding:8px 12px;display:flex;align-items:center;gap:5px}
.sidebar .dot{width:5px;height:5px;border-radius:50%;background:#3fb950}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#161b22;border-bottom:1px solid #21262d;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar .info{display:flex;gap:12px;align-items:center;font-size:11px;color:#8b949e}
.topbar .info span{padding:2px 8px;border-radius:8px;background:#21262d}
.topbar .info .turn{color:#58a6ff;font-weight:600}
.topbar .live-dot{width:5px;height:5px;border-radius:50%;background:#3fb950;box-shadow:0 0 6px rgba(63,185,80,.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{display:flex;flex:1;overflow:hidden}
/* Left: multimodal */
.panel-left{width:220px;background:#161b22;border-right:1px solid #21262d;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.panel-left .mod-card{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px}
.panel-left .mod-label{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.panel-left .cam-box{aspect-ratio:4/3;background:#0d1117;border:1px solid #21262d;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.panel-left .cam-box .face{width:50%;height:60%;border:2px dashed rgba(88,166,255,.12);border-radius:35%;animation:fpulse 3s ease-in-out infinite}
@keyframes fpulse{0%,100%{border-color:rgba(88,166,255,.08)}50%{border-color:rgba(88,166,255,.25)}}
.panel-left .cam-box .txt{font-size:10px;color:#484f58;position:absolute}
.panel-left .mic-btn{width:100%;padding:8px;border-radius:6px;border:1px solid #21262d;background:#0d1117;color:#c9d1d9;cursor:pointer;font-size:11px;text-align:center;transition:all .15s}
.panel-left .mic-btn:hover{background:#1c2128}
.panel-left .mic-btn.rec{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.25)}
.panel-left .privacy-note{font-size:9px;color:#484f58;text-align:center;margin-top:auto}
/* Center: chat */
.panel-center{flex:1;display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#484f58;gap:10px}
.welcome .icon{font-size:40px}
.welcome .t{font-size:14px;color:#8b949e}
.welcome .s{font-size:11px}
.msg{display:flex;gap:8px;max-width:80%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.asst{align-self:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.msg.asst .av{background:#1f6feb22}.msg.user .av{background:#3fb95022}
.msg .bub{padding:9px 14px;border-radius:10px;line-height:1.55;font-size:12px}
.msg.asst .bub{background:#161b22;border:1px solid #21262d;border-top-left-radius:3px}
.msg.user .bub{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.1);border-top-right-radius:3px}
.msg .meta{font-size:9px;color:#484f58;margin-top:2px;padding:0 3px}
.input-area{padding:12px 18px;border-top:1px solid #21262d;background:#161b22;display:flex;gap:8px}
.input-area input{flex:1;padding:9px 12px;background:#0d1117;border:1px solid #21262d;border-radius:8px;color:#c9d1d9;font-size:12px;outline:none}
.input-area input:focus{border-color:#58a6ff}
.input-area input:disabled{opacity:.3}
.input-area button{padding:9px 18px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer}
.btn-send{background:#238636;color:#fff}.btn-send:disabled{opacity:.3}
.btn-report{background:#d2991d;color:#000;display:none}
/* Right: agent */
.panel-right{width:280px;background:#161b22;border-left:1px solid #21262d;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.panel-right .card{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px}
.panel-right .card-hdr{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.intent-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.intent-badge.g{background:rgba(88,166,255,.1);color:#58a6ff}
.intent-badge.s{background:rgba(63,185,80,.1);color:#3fb950}
.intent-badge.h{background:rgba(210,153,29,.1);color:#d2991d}
.intent-badge.e{background:rgba(248,81,73,.1);color:#f85149}
.mem-row{display:flex;justify-content:space-between;padding:4px 0;font-size:10px;border-bottom:1px solid rgba(255,255,255,.02)}
.mem-row .k{color:#8b949e}.mem-row .v{font-weight:600}.v.g{color:#3fb950}.v.w{color:#d2991d}.v.b{color:#f85149}
.tool-log{font-size:10px;color:#8b949e;line-height:1.7}
.dim-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10px}
.dim-row .dn{width:44px;text-align:right;color:#8b949e;flex-shrink:0}
.dim-row .dt{flex:1;height:4px;background:#21262d;border-radius:2px}
.dim-row .df{height:100%;border-radius:2px;transition:width .5s}
.dim-row .dv{width:20px;text-align:right;font-weight:600;flex-shrink:0}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">🤖 AI面试官</div>
  <a href="01-home.html" class="nav-item">🏠 首页</a>
  <a href="01-home.html" class="nav-item">📋 面试记录</a>
  <div class="spacer"></div>
  <div class="status"><span class="dot"></span>进行中</div>
</div>
<div class="main-wrap">
<div class="topbar">
  <span id="posTag" style="font-size:13px;color:#c9d1d9;font-weight:600"></span>
  <div class="info"><span>第 <span class="turn" id="turnNum">0</span> / 12 轮</span><div class="live-dot"></div></div>
</div>
<div class="main">
  <!-- 左栏：多模态 -->
  <div class="panel-left">
    <div class="mod-card">
      <div class="mod-label">📷 视觉感知 (MediaPipe)</div>
      <div class="cam-box"><div class="face"></div><div class="txt">面部特征提取中</div></div>
      <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px"><span style="font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(88,166,255,.06);color:#58a6ff">👁 注视</span><span style="font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(88,166,255,.06);color:#58a6ff">😊 表情</span><span style="font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(88,166,255,.06);color:#58a6ff">✅ 姿态</span></div>
    </div>
    <div class="mod-card">
      <div class="mod-label">🎤 语音采集 (Whisper)</div>
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙️ 点击录音</button>
    </div>
    <div class="mod-card">
      <div class="mod-label">📄 简历匹配</div>
      <div style="font-size:10px;color:#8b949e;text-align:center;padding:6px">动态关键词匹配中</div>
    </div>
    <div class="privacy-note">视觉在浏览器端处理<br>视频流不离开本地</div>
  </div>
  <!-- 中栏：对话 -->
  <div class="panel-center">
    <div class="messages" id="messages"><div class="welcome" id="welcomeMsg"><div class="icon">🤖</div><div class="t">AI 面试官已就绪</div><div class="s">面试即将开始...</div></div></div>
    <div class="input-area" id="inputArea">
      <input id="userInput" placeholder="输入你的回答..." onkeydown="if(event.key==='Enter')send()">
      <button class="btn-send" id="sendBtn" onclick="send()">发送</button>
      <button class="btn-report" id="reportBtn" onclick="viewReport()">📊 查看报告</button>
    </div>
  </div>
  <!-- 右栏：Agent -->
  <div class="panel-right">
    <div class="card"><div class="card-hdr">🎯 意图识别</div><div id="intentD"><span class="intent-badge g">等待</span></div></div>
    <div class="card"><div class="card-hdr">🧠 记忆模块</div><div id="memD"><div class="mem-row"><span class="k">擅长</span><span class="v g" id="memS">积累中</span></div><div class="mem-row"><span class="k">薄弱</span><span class="v w" id="memW">未发现</span></div><div class="mem-row"><span class="k">压力</span><span class="v" id="memP">0.0</span></div><div class="mem-row"><span class="k">话题</span><span class="v" id="memT">0/5</span></div></div></div>
    <div class="card"><div class="card-hdr">🔧 工具调用 (RAG)</div><div class="tool-log" id="toolLog">等待决策...</div></div>
    <div class="card"><div class="card-hdr">🗺️ 任务规划</div><div style="font-size:12px;font-weight:600;color:#58a6ff" id="planD">准备中</div></div>
    <div class="card"><div class="card-hdr">📐 18维实时评分</div><div id="dims"></div></div>
  </div>
</div>
</div>
</div>
<script>
const p=new URLSearchParams(location.search),pos=p.get('pos')||'前端开发工程师',sid='demo_'+Date.now();
document.getElementById('posTag').textContent=pos;
let msgs=[],turn=0,mem={s:[],w:[],pr:0,t:[]},isRec=!1;
function rf(){return{left_eye_open:.7+Math.random()*.28,right_eye_open:.7+Math.random()*.28,eye_blink_rate:8+Math.random()*30,gaze_x:(Math.random()-.5)*.3,gaze_y:(Math.random()-.5)*.2,gaze_stability:.4+Math.random()*.55,head_yaw:(Math.random()-.5)*6,head_pitch:(Math.random()-.5)*4,head_roll:(Math.random()-.5)*2,head_movement:.03+Math.random()*.25,smile_ratio:.1+Math.random()*.6,expression_variance:.1+Math.random()*.5,face_present:!0,face_confidence:.8+Math.random()*.2}}
function toggleMic(){isRec=!isRec;const b=document.getElementById('micBtn');isRec?(b.textContent='🔴 录音中',b.classList.add('rec'),setTimeout(()=>{if(isRec){toggleMic();document.getElementById('userInput').value='(语音输入) 我对这个领域有深入理解';}},2000)):(b.textContent='🎙️ 点击录音',b.classList.remove('rec'))}
async function send(){
  const inp=document.getElementById('userInput'),txt=inp.value.trim();if(!txt)return;inp.value='';
  addMsg('user',txt);msgs.push({role:'user',content:txt});turn++;document.getElementById('turnNum').textContent=turn;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,position:pos,messages:[...msgs],face_data:rf()})});
    const d=await r.json();
    addMsg('asst',d.reply,d.agent_decision,d.overall_score);msgs.push({role:'assistant',content:d.reply});
    update(d);
    if(d.agent_decision==='结束'){
      document.getElementById('userInput').disabled=!0;document.getElementById('sendBtn').style.display='none';document.getElementById('reportBtn').style.display='inline-block';
      const rs=JSON.parse(localStorage.getItem('interview_records')||'[]');rs.push({sid,position:pos,date:new Date().toLocaleDateString(),turns:turn,score:d.overall_score,grade:d.overall_score>=65?'优秀':d.overall_score>=40?'中等':'需提升'});localStorage.setItem('interview_records',JSON.stringify(rs));
    }
  }catch(e){addMsg('asst','连接失败')}
}
function addMsg(role,txt,dec,sc){
  const w=document.getElementById('welcomeMsg');if(w)w.remove();
  const d=document.createElement('div');d.className='msg '+role;
  const av=role==='user'?'👤':'🤖';let m='';if(dec)m='<div class="meta">'+({深挖弱点:'🔍',转话题:'🔄',给提示:'💡',结束:'🏁',开场:'👋'}[dec]||'')+' '+dec+' · '+sc.toFixed(0)+'分</div>';
  d.innerHTML='<div class="av">'+av+'</div><div><div class="bub">'+txt+'</div>'+m+'</div>';
  document.getElementById('messages').appendChild(d);d.scrollIntoView({behavior:'smooth'});
}
function update(d){
  const dec=d.agent_decision,dims=d.dimensions||[],di={深挖弱点:'🔍',转话题:'🔄',给提示:'💡',结束:'🏁',开场:'👋'};
  let b='';if(dec==='开场')b='<span class="intent-badge g">👋 开场</span>';else if(dec==='深挖弱点')b='<span class="intent-badge s">🔍 深挖</span>';else if(dec==='转话题')b='<span class="intent-badge s">🔄 拓展</span>';else if(dec==='给提示')b='<span class="intent-badge h">💡 辅助</span>';else if(dec==='结束')b='<span class="intent-badge e">🏁 终止</span>';
  document.getElementById('intentD').innerHTML=b;
  const st=dims.filter(x=>x.score>=65).map(x=>x.name),wk=dims.filter(x=>x.score<40).map(x=>x.name);
  if(st.length)mem.s=[...new Set([...mem.s,...st])];if(wk.length)mem.w=[...new Set([...mem.w,...wk])];
  mem.pr=d.pressure_level||0;mem.t=[...new Set([...mem.t,dec])];
  document.getElementById('memS').textContent=mem.s.slice(0,3).join(',')||'积累中';document.getElementById('memW').textContent=mem.w.slice(0,3).join(',')||'未发现';document.getElementById('memW').className='v '+(mem.w.length>2?'b':'w');
  document.getElementById('memP').textContent=mem.pr.toFixed(1);document.getElementById('memP').className='v '+(mem.pr>.4?'b':mem.pr>.2?'w':'g');
  document.getElementById('memT').textContent=mem.t.length+'/5';
  document.getElementById('toolLog').innerHTML='📡 ChromaDB → 📋 '+(dec==='深挖弱点'?'弱点匹配':dec==='转话题'?'未覆盖话题':dec==='给提示'?'基础概念':'')+' → 📚 '+(d.knowledge_used||0)+'条 → 🔗 Prompt';
  document.getElementById('planD').textContent=(di[dec]||'')+' '+(dec==='开场'?'首轮→开场白':dec==='深挖弱点'?'弱点→深挖':dec==='转话题'?'充分→转题':dec==='给提示'?'帮助→提示':dec==='结束'?'完毕→结束':'决策中');
  let dh='';dims.forEach(d=>{const c=d.score>=65?'#3fb950':d.score>=40?'#d2991d':'#f85149';dh+='<div class="dim-row"><span class="dn">'+d.name+'</span><div class="dt"><div class="df" style="width:'+d.score+'%;background:'+c+'"></div></div><span class="dv" style="color:'+c+'">'+d.score.toFixed(0)+'</span></div>';});
  document.getElementById('dims').innerHTML=dh;
}
function viewReport(){location.href='03-report.html?sid='+encodeURIComponent(sid);}
setTimeout(()=>{document.getElementById('userInput').value='开始面试';send();},500);
</script>
</body>
</html>
